name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod  # 跟随 go.mod，避免与 Dockerfile/本地版本漂移
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            echo "请在本地执行: gofmt -w ."
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Test with race detector
        # 并发正确性门禁：W3 审查发现两处漏锁（IngestDiscover/CoverageReport），
        # 根因是本地 Windows 跑不了 -race（cgo 限制），必须由 CI 兜底。
        run: go test -race ./...
      - name: 模块边界检查（P1-2）
        run: python scripts/check_module_boundaries.py

  goplugin-smoke-windows:
    # T2：go-plugin 在 Windows 上的冒烟（v1.3 ADR-006）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod  # 跟随 go.mod，避免与 Dockerfile/本地版本漂移
      - name: Build plugin binary
        # 必须先编译插件：宿主通过子进程拉起 bin/plugin.exe
        working-directory: tools/smoke/goplugin
        run: go build -o bin/plugin.exe ./plugin
      - name: go-plugin Windows smoke
        working-directory: tools/smoke/goplugin
        run: go run ./host

  goplugin-smoke-linux:
    # T2 原始要求：Windows / Linux 各跑一遍
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod  # 跟随 go.mod，避免与 Dockerfile/本地版本漂移
      - name: Build plugin binary
        working-directory: tools/smoke/goplugin
        run: go build -o bin/plugin.exe ./plugin
      - name: go-plugin Linux smoke
        working-directory: tools/smoke/goplugin
        run: go run ./host
