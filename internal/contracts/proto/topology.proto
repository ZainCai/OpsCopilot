syntax = "proto3";

package opscopilot.contracts.v1;

option go_package = "opscopilot/internal/contracts/pb;pb";

// 语义模型服务：拓扑与变更的时点查询（v1.2 C15）
service SemanticModel {
  // GetTopology 查询时点拓扑。as_of 为空表示当前时刻。
  // RCA 必须传入故障时刻 T0，禁止用当前拓扑分析历史事件。
  rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);
  // GetRecentChanges 查询节点在窗口内的变更（RCA 证据）。
  rpc GetRecentChanges(GetRecentChangesRequest) returns (GetRecentChangesResponse);
}

message GetTopologyRequest {
  string tenant_id = 1;
  string node_key = 2;
  int32 depth = 3;
  // RFC3339 时间戳；为空=当前时刻
  string as_of = 4;
}

message TopologyNode {
  string node_key = 1;
  string node_type = 2;
  string valid_from = 3;
  string valid_to = 4;
  string confidence = 5;
  string source = 6;
}

message TopologyEdge {
  string src_key = 1;
  string dst_key = 2;
  string relation = 3;
  string confidence = 4;
  string source = 5;
}

message GetTopologyResponse {
  repeated TopologyNode nodes = 1;
  repeated TopologyEdge edges = 2;
  string resolved_as_of = 3;
}

message GetRecentChangesRequest {
  string tenant_id = 1;
  string node_key = 2;
  string window_start = 3;
  string window_end = 4;
}

// ChangeRecord 变更记录（对外契约，全局审查 C5 三步走于 W5-2.1 完成）：
// ① proto 补字段（本版，版本化演进——新增字段全部使用新编号，向后兼容）；
// ② ChangeEvent → pb.ChangeRecord 映射在 cmd/opscopilot/semantic_model.go
//    实现（R2 契约：拓扑侧映射必须锁内完成，本消息字段来自 ChangeStore
//    值拷贝，映射在锁外安全）；
// ③ 类型映射统一走 ChangeType 字符串化（string(ev.Type)，封闭集合由
//    topology.ParseChangeType 保证）。
message ChangeRecord {
  string node_key = 1;
  string change_type = 2;
  string occurred_at = 3;
  string actor = 4;
  // ---- W5-2.1 扩展（C5：证据字段对齐内存模型 ChangeEvent）----
  string id = 5;              // 幂等键（重复提交返回原记录的依据）
  string source = 6;          // 变更来源：git / jenkins / manual
  string ref = 7;             // 分支名 / 流水线名
  string revision = 8;        // commit sha / build number
  string summary = 9;         // 一句话说明改了什么
  string confidence = 10;     // 事件置信度：high / medium / low（ADR-007）
  string tenant_id = 11;      // 租户隔离（M1 单租户常为空）
}

message GetRecentChangesResponse {
  repeated ChangeRecord changes = 1;
}
