<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsCopilot 控制台</title>
<style>
/* ===== OpsCopilot 控制台 · EagleOps 原型设计规范适配版 =====
   设计令牌与组件形态对齐 console_source_sample（暗色默认 + 浅色跟随系统），
   功能契约不变：簇列表/详情、拓扑图、节点变更查询、自动刷新。 */

/* ---------- 设计令牌（对齐原型 styles.css） ---------- */
:root {
  --font-sans: "IBM Plex Sans", "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", "SF Mono", Consolas, "Courier New", monospace;

  /* 暗色（默认，与原型一致） */
  --bg: #0f172a;
  --bg-soft: #131b30;
  --panel: #1e293b;
  --panel-2: #233046;
  --raised: #2a3a52;
  --line: #334155;
  --line-soft: #2b3a4f;
  --text: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --brand: #6366f1;
  --brand-ink: #ffffff;
  --ok: #22c55e;
  --warn: #f59e0b;
  --crit: #ef4444;
  --info: #3b82f6;
  --radius: 10px;
  --row-h: 44px;
  --pad: 18px;
  --shadow: 0 12px 34px rgba(2, 6, 18, 0.5);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #eef2f7; --bg-soft: #f4f7fb; --panel: #ffffff; --panel-2: #f6f8fc;
    --raised: #ffffff; --line: #dbe3ee; --line-soft: #e6ecf4;
    --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
    --brand: #4f46e5; --ok: #16a34a; --warn: #d97706; --crit: #dc2626; --info: #2563eb;
    --shadow: 0 8px 26px rgba(30, 42, 60, 0.14);
  }
}

/* ---------- 基础 ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text);
       font-size: 13px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }

/* ---------- 顶部工具栏（原型 topbar 形态） ---------- */
.topbar { min-height: 54px; display: flex; align-items: center; flex-wrap: wrap; row-gap: 8px;
          gap: 12px; padding: 0 20px; background: var(--bg-soft);
          border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-glyph { width: 26px; height: 26px; border-radius: 8px; background: color-mix(in srgb, var(--brand) 18%, transparent);
               color: var(--brand); display: flex; align-items: center; justify-content: center;
               font-size: 13px; font-weight: 700; flex: none; }
.brand-name { font-weight: 600; font-size: 14px; letter-spacing: .2px; }
.brand-sub { font-size: 10.5px; color: var(--text-3); letter-spacing: 1.5px; }
.tb-spacer { flex: 1; }
.env-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
            border-radius: 7px; font-size: 12px; font-family: var(--font-mono); }
.env-chip.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.env-chip.bad { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit); }
.env-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.tb-meta { font-size: 11.5px; color: var(--text-3); font-family: var(--font-mono); }
.select { height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
          padding: 0 8px; font-size: 12px; cursor: pointer; color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px;
       border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
       color: var(--text); font-size: 12.5px; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--panel-2); border-color: var(--text-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn--acc { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.btn--acc:hover { background: color-mix(in srgb, var(--brand) 85%, #ffffff); border-color: transparent; color: var(--brand-ink); }
.btn--sm { height: 26px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btn.busy::after { content: "⋯"; }
label.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); cursor: pointer; }

/* seg 分段控件（原型 Seg 形态：状态过滤） */
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg-i { height: 26px; padding: 0 11px; border-radius: 7px; font-size: 12px; color: var(--text-2);
         background: none; border: none; cursor: pointer; white-space: nowrap; }
.seg-i:hover { color: var(--text); }
.seg-i.on { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.seg-i.on.acc { color: var(--brand); }

/* ---------- 布局 ---------- */
.content { max-width: 1600px; margin: 0 auto; padding: 18px 24px 56px; display: grid; gap: 14px; }
.page-head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.page-title { font-size: 19px; font-weight: 600; letter-spacing: .2px; }
.page-desc { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }

/* ---------- KPI 卡（原型 stat 形态：label / 25px mono 大数 / 单位 / 副文本） ---------- */
.stat { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius);
        padding: 13px 15px; min-width: 0; }
.stat-l { font-size: 11.5px; color: var(--text-2); }
.stat-v { display: flex; align-items: baseline; gap: 5px; margin-top: 6px; }
.stat-n { font-family: var(--font-mono); font-size: 25px; font-weight: 600; line-height: 1.05; letter-spacing: -.5px; }
.stat-u { font-size: 12px; color: var(--text-3); }
.stat-s { font-size: 11.5px; margin-top: 5px; color: var(--text-3); }

/* ---------- 面板（原型 panel：标题栏 + flush 表格体） ---------- */
.panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 var(--pad);
           border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; row-gap: 4px; }
.panel-t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-sub { font-size: 11.5px; color: var(--text-3); }
.panel-x { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.panel-b { padding: var(--pad); }
.panel-b--flush { padding: 0; }

/* ---------- 表格（原型 tbl：44px 行高、hover brand 6%） ---------- */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 720px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--text-3);
          padding: 0 12px; height: 36px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th.num, .tbl td.num { text-align: right; }
.tbl td { padding: 0 12px; height: var(--row-h); border-bottom: 1px solid var(--line-soft);
          white-space: nowrap; vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr.rowlink { cursor: pointer; }
.tbl tbody tr:hover { background: color-mix(in srgb, var(--brand) 6%, transparent); }
.tbl tbody tr.sel { background: color-mix(in srgb, var(--brand) 10%, transparent); }
.tbl .time { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); }

/* ---------- 徽标（原型 SevBadge/StChip 形态：底纹+同色文字，非实色块） ---------- */
.sev { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px;
       font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .5px; }
.sev--critical { background: color-mix(in srgb, var(--crit) 16%, transparent); color: var(--crit); }
.sev--warning  { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.sev--info     { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 7px;
        border: 1px solid var(--line); background: var(--panel-2); font-size: 11.5px; color: var(--text-2); }
.chip--open     { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 40%, transparent); background: color-mix(in srgb, var(--brand) 10%, transparent); }
.chip--acked    { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
.chip--resolved { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }

/* ---------- 横幅 / 空状态 / 加载 ---------- */
.banner { display: flex; gap: 8px; align-items: flex-start; border-radius: 8px;
          padding: 10px 13px; margin: var(--pad); font-size: 12.5px; }
.panel-b--flush .banner { margin: 12px var(--pad); }
.banner.err  { background: color-mix(in srgb, var(--crit) 10%, transparent);
               color: var(--crit); border: 1px solid color-mix(in srgb, var(--crit) 35%, transparent); }
.banner.warn { background: color-mix(in srgb, var(--warn) 10%, transparent);
               color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner .x { margin-left: auto; cursor: pointer; opacity: .7; }
.banner .x:hover { opacity: 1; }
.empty { text-align: center; padding: 34px 12px; }
.empty .e-t { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.empty .e-d { font-size: 12px; color: var(--text-3); max-width: 460px; margin: 0 auto; line-height: 1.6; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line);
        border-top-color: var(--brand); border-radius: 50%; animation: r .8s linear infinite;
        vertical-align: -2px; margin-right: 7px; }
@keyframes r { to { transform: rotate(360deg); } }

/* ---------- 详情 / 图例 / 拓扑 ---------- */
.detail { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 8px;
          padding: 12px 14px; margin: 12px var(--pad); max-height: 320px; overflow: auto; font-size: 12px; }
.detail .dt { font-weight: 600; margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; }
.kv .k { color: var(--text-3); }
.kv .v { font-family: var(--font-mono); font-size: 11.5px; overflow-wrap: anywhere; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.topo-wrap { background: var(--panel-2); border-radius: 8px; overflow: hidden; }
svg text { fill: var(--text); font-family: var(--font-mono); font-size: 11px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-glyph">OC</div>
    <div>
      <div class="brand-name">OpsCopilot</div>
      <div class="brand-sub">SHADOW CONSOLE</div>
    </div>
  </div>
  <div class="tb-spacer"></div>
  <span class="env-chip" id="connChip"><span class="dot"></span><span id="connText">连接中</span></span>
  <span class="tb-meta" id="lastRefresh">未刷新</span>
  <label class="toggle"><input type="checkbox" id="autoRefresh" checked> 30s 自动刷新</label>
  <button class="btn" id="btnRefresh" onclick="refreshAll()">刷新</button>
</div>

<div class="content">
  <div class="page-head">
    <div>
      <div class="page-title">降噪总览</div>
      <div class="page-desc">影子模式判决 · 只标注不拦截 · 点击簇行查看详情</div>
    </div>
    <div style="margin-left:auto">
      <div class="seg" id="stateSeg">
        <button class="seg-i on acc" data-v="active">活跃</button>
        <button class="seg-i" data-v="resolved">已解决</button>
        <button class="seg-i" data-v="all">全部</button>
      </div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="stat"><div class="stat-l">活跃簇</div>
      <div class="stat-v"><span class="stat-n" id="statActive" style="color:var(--brand)">—</span><span class="stat-u">簇</span></div>
      <div class="stat-s" id="statActiveSub">未刷新</div></div>
    <div class="stat"><div class="stat-l">已解决</div>
      <div class="stat-v"><span class="stat-n" id="statResolved" style="color:var(--ok)">—</span><span class="stat-u">簇</span></div>
      <div class="stat-s" id="statResolvedSub">静默期自动收敛</div></div>
    <div class="stat"><div class="stat-l">告警总量</div>
      <div class="stat-v"><span class="stat-n" id="statAlerts">—</span><span class="stat-u">条</span></div>
      <div class="stat-s">当前过滤下簇内累计</div></div>
    <div class="stat"><div class="stat-l">拓扑规模</div>
      <div class="stat-v"><span class="stat-n" id="statNodes">—</span><span class="stat-u">节点</span></div>
      <div class="stat-s" id="statEdgesSub">— 边</div></div>
  </div>

  <div class="panel">
    <div class="panel-h">
      <span class="panel-t">告警簇</span>
      <span class="panel-sub" id="clusterCount"></span>
      <div class="panel-x"><span class="panel-sub" id="clusterHint"></span></div>
    </div>
    <div id="clusterMsg"></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>cluster_key</th><th>状态</th><th>严重级</th>
          <th class="num">告警数</th><th>摘要</th>
          <th class="num">指纹</th><th class="num">节点</th><th>最近告警</th>
        </tr></thead>
        <tbody id="clusterRows"></tbody>
      </table>
    </div>
    <div id="clusterDetail" class="detail" style="display:none"></div>
  </div>

  <div class="panel">
    <div class="panel-h">
      <span class="panel-t">拓扑图</span>
      <span class="panel-sub" id="topoMeta"></span>
      <div class="panel-x legend">
        <span><i style="background:var(--ok)"></i>high（观测事实）</span>
        <span><i style="background:var(--warn)"></i>medium（聚合/声明）</span>
        <span><i style="background:var(--text-3)"></i>low（不进因果推理，ADR-007）</span>
      </div>
    </div>
    <div id="topoMsg"></div>
    <div id="topoView"></div>
    <div id="nodeDetail" class="detail" style="display:none"></div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 原型 SevBadge/StChip 形态：底纹 + 同色文字。
const sevPill = (s) => `<span class="sev sev--${esc(s||"info")}">${esc((s||"-").toUpperCase())}</span>`;
const statePill = (s) => `<span class="chip chip--${esc(s)}">${esc(s)}</span>`;

// API base：默认同源（经 opscopilot 服务访问）；静态打开本文件时可用
// ?api=http://127.0.0.1:8080 指向运行中的服务（REST 网关已放开只读 CORS）。
const API_BASE = new URLSearchParams(location.search).get("api") || "";
async function fetchJSON(url) {
  const resp = await fetch(API_BASE + url);
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    if (resp.status === 404 && !API_BASE && location.protocol === "file:") {
      throw new Error("404——本页面是静态文件，没有后端 API。请启动 opscopilot 后访问 http://127.0.0.1:8080/console");
    }
    throw new Error(body.error || (resp.status + " " + resp.statusText));
  }
  return body;
}

// ---- 呈现辅助 ----
function msg(el, kind, text) {
  el.innerHTML = text
    ? `<div class="banner ${kind}"><span>${kind === "loading" ? '<span class="spin"></span>' : "⚠"}</span><span>${esc(text)}</span>${kind === "err" ? '<span class="x" onclick="this.parentElement.remove()">✕</span>' : ""}</div>`
    : "";
}
function emptyState(title, desc) {
  return `<tr><td colspan="8"><div class="empty"><div class="e-t">${esc(title)}</div><div class="e-d">${esc(desc)}</div></div></td></tr>`;
}
function timeAgo(iso) {
  if (!iso) return "—";
  const d = new Date(iso), diff = (Date.now() - d) / 1000;
  const full = iso.replace("T", " ").slice(0, 19);
  const rel = diff < 60 ? Math.max(0, Math.floor(diff)) + "s 前"
    : diff < 3600 ? Math.floor(diff/60) + "m 前"
    : diff < 86400 ? Math.floor(diff/3600) + "h 前"
    : Math.floor(diff/86400) + "d 前";
  return `<span title="${esc(full)}">${rel}</span>`;
}
function setConn(ok) {
  $("connChip").className = "env-chip " + (ok ? "ok" : "bad");
  $("connText").textContent = ok ? "服务正常" : "连接异常";
  $("lastRefresh").textContent = "刷新于 " + new Date().toLocaleTimeString();
}

// ---- 统计卡 ----
function renderStats(clusters, topoNodes) {
  const act = clusters.filter(c => c.state === "open" || c.state === "acked").length;
  const res = clusters.filter(c => c.state === "resolved").length;
  const alerts = clusters.reduce((n, c) => n + (c.alert_count || 0), 0);
  $("statActive").textContent = act;
  $("statActiveSub").textContent = res + " 簇已解决";
  $("statResolved").textContent = res;
  $("statResolvedSub").textContent = "静默期自动收敛";
  $("statAlerts").textContent = alerts;
  $("statNodes").textContent = topoNodes ?? "—";
  $("statEdgesSub").textContent = window._lastEdges != null ? window._lastEdges + " 边" : "—";
}

// ---- 簇列表 ----
let clusterCache = [];
let curState = "active";
async function loadClusters() {
  msg($("clusterMsg"), "loading", "加载告警簇…");
  try {
    const data = await fetchJSON("/api/v1/clusters?state=" + curState + "&limit=200");
    clusterCache = data.clusters || [];
    $("clusterCount").textContent = `${data.count}${data.truncated ? "+" : ""} 个（当前过滤）`;
    $("clusterHint").textContent = data.truncated ? "已截断至 limit=200" : "";
    $("clusterRows").innerHTML = clusterCache.map(c => `
      <tr class="rowlink" data-key="${esc(c.cluster_key)}">
        <td class="mono">${esc(c.cluster_key)}</td>
        <td>${statePill(c.state)}</td>
        <td>${sevPill(c.severity)}</td>
        <td class="num mono">${c.alert_count}</td>
        <td>${esc(c.summary || "-")}</td>
        <td class="num mono">${(c.fingerprints||[]).length}</td>
        <td class="num mono">${(c.node_keys||[]).length}</td>
        <td class="time">${timeAgo(c.last_seen_at)}</td>
      </tr>`).join("") || emptyState(
        curState === "active" ? "当前无活跃簇，系统运行正常" : "当前过滤条件下没有簇",
        curState === "active"
          ? "影子降噪在跑；告警进管道后会自动聚簇并在此展示。"
          : "调整上方分段过滤（活跃 / 已解决 / 全部）查看其他状态。");
    $("clusterRows").querySelectorAll("tr.rowlink").forEach(tr => {
      tr.onclick = () => {
        $("clusterRows").querySelectorAll("tr").forEach(r => r.classList.remove("sel"));
        tr.classList.add("sel");
        showClusterDetail(tr.dataset.key);
      };
    });
    msg($("clusterMsg"), "", "");
    setConn(true);
    renderStats(clusterCache, null);
  } catch (e) {
    msg($("clusterMsg"), "err", "加载失败：" + e.message);
    $("clusterRows").innerHTML = emptyState("加载失败", e.message);
    setConn(false);
  }
}

async function showClusterDetail(key) {
  const box = $("clusterDetail");
  box.style.display = "block";
  box.innerHTML = `<div class="dt">簇详情</div><span class="spin"></span>`;
  try {
    const c = await fetchJSON("/api/v1/clusters/" + encodeURIComponent(key));
    const kv = [
      ["状态", c.state], ["严重级", c.severity || "-"], ["告警数", c.alert_count],
      ["首见", (c.first_seen_at||"").replace("T"," ").slice(0,19)],
      ["最近", (c.last_seen_at||"").replace("T"," ").slice(0,19)],
      ["指纹", (c.fingerprints||[]).join(", ") || "-"],
      ["节点", (c.node_keys||[]).join(", ") || "-"],
    ];
    box.innerHTML = `<div class="dt">簇详情</div><div class="kv">` +
      kv.map(([k,v]) => `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`).join("") + `</div>`;
  } catch (e) { box.textContent = "加载失败：" + e.message; }
}

// ---- 拓扑 ----
const AGG_THRESHOLD = 300;
async function loadTopology() {
  msg($("topoMsg"), "loading", "加载拓扑…");
  try {
    const data = await fetchJSON("/api/v1/topology");
    const nodes = data.nodes || [], edges = data.edges || [];
    window._lastEdges = edges.length;
    $("topoMeta").textContent = `${nodes.length} 节点 / ${edges.length} 边`;
    const view = $("topoView");
    if (nodes.length === 0) {
      view.innerHTML = `<div class="empty" style="padding:10px var(--pad) 20px"><div class="e-t">拓扑为空</div><div class="e-d">等第一轮发现进图——连接器接入后 30s 内出现。</div></div>`;
    } else if (nodes.length > AGG_THRESHOLD) {
      renderAggregate(nodes);
    } else {
      renderGraph(nodes, edges);
    }
    msg($("topoMsg"), "", "");
    renderStats(clusterCache, nodes.length);
  } catch (e) {
    msg($("topoMsg"), "err", "加载失败：" + e.message);
  }
}

function renderAggregate(nodes) {
  // P2-1 聚合渲染：按 node_type 分桶，统计置信度分布。
  const byType = {};
  for (const n of nodes) {
    const t = n.node_type || "unknown";
    byType[t] = byType[t] || { count: 0, high: 0, medium: 0, low: 0 };
    byType[t].count++;
    byType[t][n.confidence || "low"] = (byType[t][n.confidence || "low"] || 0) + 1;
  }
  let html = `<div class="panel-b" style="padding-top:12px"><div class="banner warn">节点数 ${nodes.length} 超过渲染阈值 ${AGG_THRESHOLD}——聚合视图（按类型分桶，钻取展开留 W6+）</div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>type</th><th class="num">节点数</th><th class="num">high</th><th class="num">medium</th><th class="num">low</th></tr></thead><tbody>`;
  for (const [t, v] of Object.entries(byType).sort()) {
    html += `<tr><td class="mono">${esc(t)}</td><td class="num mono">${v.count}</td><td class="num mono" style="color:var(--ok)">${v.high||0}</td><td class="num mono" style="color:var(--warn)">${v.medium||0}</td><td class="num mono faint">${v.low||0}</td></tr>`;
  }
  html += `</tbody></table></div></div>`;
  $("topoView").innerHTML = html;
}

function renderGraph(nodes, edges) {
  const W = 1100, H = 560, R = Math.min(230, 60 + nodes.length * 4);
  const pos = {};
  nodes.forEach((n, i) => {
    const a = (2 * Math.PI * i) / nodes.length - Math.PI / 2;
    pos[n.node_key] = { x: W/2 + R * Math.cos(a), y: H/2 + R * Math.sin(a) };
  });
  const color = { high: "var(--ok)", medium: "var(--warn)", low: "var(--text-3)" };
  let svg = `<div class="topo-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  for (const e of edges) {
    const s = pos[e.src_key], d = pos[e.dst_key];
    if (!s || !d) continue;
    svg += `<line x1="${s.x}" y1="${s.y}" x2="${d.x}" y2="${d.y}" stroke="var(--line)" stroke-width="1"/>`;
  }
  for (const n of nodes) {
    const p = pos[n.node_key];
    const c = color[n.confidence || "low"] || color.low;
    const r = n.confidence === "high" ? 6 : 4;
    svg += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${c}" data-key="${esc(n.node_key)}" style="cursor:pointer"><title>${esc(n.node_key)} (${esc(n.node_type)}, ${esc(n.confidence)})</title></circle>`;
  }
  nodes.slice(0, 40).forEach((n) => {
    const p = pos[n.node_key];
    svg += `<text x="${p.x + 9}" y="${p.y + 3}">${esc(n.node_key.length > 28 ? n.node_key.slice(0, 27) + "…" : n.node_key)}</text>`;
  });
  svg += `</svg></div>`;
  $("topoView").innerHTML = svg;
  $("topoView").querySelectorAll("circle").forEach(c => {
    c.onclick = () => showNodeDetail(c.dataset.key);
  });
}

async function showNodeDetail(key) {
  const box = $("nodeDetail");
  box.style.display = "block";
  box.innerHTML = `<div class="dt">节点 ${esc(key)}</div><span class="spin"></span>`;
  try {
    const [topo, changes] = await Promise.all([
      fetchJSON("/api/v1/topology?node_key=" + encodeURIComponent(key) + "&depth=1"),
      fetchJSON("/api/v1/changes?node_key=" + encodeURIComponent(key) +
        "&window_start=" + new Date(Date.now() - 24*3600*1000).toISOString()),
    ]);
    const ch = changes.changes || [];
    box.innerHTML = `<div class="dt">节点 ${esc(key)}</div>` +
      `<div style="margin-bottom:6px">邻居 <b class="mono">${(topo.nodes||[]).length - 1}</b> · 边 <b class="mono">${(topo.edges||[]).length}</b> · 24h 变更 <b class="mono">${ch.length}</b></div>` +
      (ch.length
        ? ch.map(c => `<div><span class="sev sev--info" style="margin-right:6px">${esc(c.change_type)}</span><span class="mono faint">${esc((c.occurred_at||"").replace("T"," ").slice(0,19))}</span> ${esc(c.actor || c.source || "")} ${esc(c.summary || "")}</div>`).join("")
        : `<div class="faint">24h 内无变更</div>`);
  } catch (e) { box.textContent = "加载失败：" + e.message; }
}

function refreshAll() {
  const b = $("btnRefresh");
  b.classList.add("busy"); b.disabled = true;
  Promise.allSettled([loadClusters(), loadTopology()]).then(() => {
    b.classList.remove("busy"); b.disabled = false;
  });
}

// seg 分段过滤（原型 Seg 交互）。
$("stateSeg").querySelectorAll(".seg-i").forEach(btn => {
  btn.onclick = () => {
    $("stateSeg").querySelectorAll(".seg-i").forEach(b => b.classList.remove("on", "acc"));
    btn.classList.add("on", "acc");
    curState = btn.dataset.v;
    loadClusters();
  };
});

let timer = null;
$("autoRefresh").onchange = () => {
  if (timer) { clearInterval(timer); timer = null; }
  if ($("autoRefresh").checked) timer = setInterval(refreshAll, 30000);
};
if ($("autoRefresh").checked) timer = setInterval(refreshAll, 30000);
refreshAll();
</script>
