<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsCopilot 控制台</title>
<style>
  /* ---- 主题变量：浅色默认 + 跟随系统深色 ---- */
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --border: #e3e8ef; --border-strong: #cbd5e1;
    --text: #101828; --muted: #667085; --faint: #98a2b3;
    --accent: #2563eb; --accent-soft: #eff6ff;
    --high: #16a34a; --medium: #d97706; --low: #98a2b3;
    --crit: #dc2626; --warn: #d97706; --info: #2563eb;
    --err-bg: #fef3f2; --err-tx: #b42318; --err-bd: #fecdca;
    --warn-bg: #fffaeb; --warn-tx: #b54708;
    --shadow: 0 1px 3px rgba(16,24,40,.07), 0 1px 2px rgba(16,24,40,.04);
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #2d333b; --border-strong: #444c56;
      --text: #e6edf3; --muted: #8b949e; --faint: #656d76;
      --accent: #58a6ff; --accent-soft: #12233f;
      --err-bg: #2d1517; --err-tx: #f87171; --err-bd: #7f1d1d;
      --warn-bg: #2b2111; --warn-tx: #fbbf24;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
         background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }

  /* ---- 顶栏：粘性、含连接状态与刷新时间 ---- */
  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
           border-bottom: 1px solid var(--border); padding: 10px 20px;
           display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px;
              display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--high); }
  .dot.bad { background: var(--crit); }
  .meta { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, select { font-size: 12.5px; padding: 5px 12px; border: 1px solid var(--border-strong);
                   border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  button.busy::after { content: "⋯"; margin-left: 4px; }
  label.toggle { display: flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; }

  /* ---- 布局：自适应容器 + 统计卡行 ---- */
  main { max-width: 1280px; margin: 0 auto; padding: 16px 20px 40px; display: grid; gap: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
          padding: 10px 14px; box-shadow: var(--shadow); }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 11px; color: var(--muted); font-weight: 400; }

  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
  section h2 { font-size: 13.5px; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
  section h2 .count { color: var(--muted); font-weight: 400; font-size: 12px; }

  /* ---- 表格：数字右对齐、时间等宽、小屏横滚 ---- */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: var(--mono); font-size: 11.5px; }
  td.time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  tr.clickable:hover { background: var(--accent-soft); cursor: pointer; }
  tr.sel { background: var(--accent-soft); }

  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11px;
          font-weight: 600; color: #fff; letter-spacing: .3px; }
  .pill.critical { background: var(--crit); }
  .pill.warning  { background: var(--warn); }
  .pill.info     { background: var(--info); }
  .pill.open     { background: #475467; }
  .pill.acked    { background: #7c3aed; }
  .pill.resolved { background: var(--faint); }
  .pill.high     { background: var(--high); }
  .pill.medium   { background: var(--medium); }
  .pill.low      { background: var(--low); }

  /* ---- 错误横幅 / 空状态 / 加载态 ---- */
  .banner { display: flex; gap: 8px; align-items: flex-start; border-radius: 6px;
            padding: 8px 12px; margin-bottom: 10px; font-size: 12.5px; }
  .banner.err  { background: var(--err-bg); color: var(--err-tx); border: 1px solid var(--err-bd); }
  .banner.warn { background: var(--warn-bg); color: var(--warn-tx); }
  .banner .x { margin-left: auto; cursor: pointer; opacity: .7; }
  .banner .x:hover { opacity: 1; }
  .empty { text-align: center; color: var(--muted); padding: 26px 10px; }
  .empty .ico { font-size: 22px; display: block; margin-bottom: 6px; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border-strong);
          border-top-color: var(--accent); border-radius: 50%; animation: r .8s linear infinite;
          vertical-align: -2px; margin-right: 6px; }
  @keyframes r { to { transform: rotate(360deg); } }

  .detail { font-size: 12px; background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 10px 12px; margin-top: 10px;
            max-height: 320px; overflow: auto; }
  .detail .dt { font-weight: 600; margin-bottom: 6px; }

  .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); margin: 2px 0 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  svg text { font-size: 10px; fill: var(--text); }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="connDot"></span>OpsCopilot 控制台</h1>
  <span class="meta" id="lastRefresh">未刷新</span>
  <div class="spacer"></div>
  <div class="toolbar">
    <select id="clusterState" title="簇状态过滤">
      <option value="active">活跃簇</option>
      <option value="resolved">已解决</option>
      <option value="all">全部</option>
    </select>
    <label class="toggle"><input type="checkbox" id="autoRefresh" checked> 30s 自动刷新</label>
    <button id="btnRefresh" onclick="refreshAll()">刷新</button>
  </div>
</header>
<main>
  <div class="stats">
    <div class="stat"><div class="k">活跃簇</div><div class="v" id="statActive">—</div></div>
    <div class="stat"><div class="k">已解决</div><div class="v" id="statResolved">—</div></div>
    <div class="stat"><div class="k">拓扑节点</div><div class="v" id="statNodes">—</div></div>
    <div class="stat"><div class="k">拓扑边</div><div class="v" id="statEdges">—</div></div>
  </div>

  <section>
    <h2>告警簇 <span class="count" id="clusterCount"></span></h2>
    <div id="clusterMsg"></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>cluster_key</th><th>状态</th><th>严重级</th>
          <th class="num">告警数</th><th>摘要</th>
          <th class="num">指纹</th><th class="num">节点</th><th>最近告警</th>
        </tr></thead>
        <tbody id="clusterRows"></tbody>
      </table>
    </div>
    <div id="clusterDetail" class="detail" style="display:none"></div>
  </section>

  <section>
    <h2>拓扑图 <span class="count" id="topoMeta"></span></h2>
    <div class="legend">
      <span><i style="background:var(--high)"></i>high（观测事实）</span>
      <span><i style="background:var(--medium)"></i>medium（聚合/声明）</span>
      <span><i style="background:var(--low)"></i>low（不进因果推理，ADR-007）</span>
    </div>
    <div id="topoMsg"></div>
    <div id="topoView"></div>
    <div id="nodeDetail" class="detail" style="display:none"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sevPill = (s) => `<span class="pill ${esc(s||"info")}">${esc(s||"-")}</span>`;
const statePill = (s) => `<span class="pill ${esc(s)}">${esc(s)}</span>`;

// API base：默认同源（经 opscopilot 服务访问）；静态打开本文件时可用
// ?api=http://127.0.0.1:8080 指向运行中的服务（REST 网关已放开只读 CORS）。
const API_BASE = new URLSearchParams(location.search).get("api") || "";
async function fetchJSON(url) {
  const resp = await fetch(API_BASE + url);
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    if (resp.status === 404 && !API_BASE && location.protocol === "file:") {
      throw new Error("404——本页面是静态文件，没有后端 API。请启动 opscopilot 后访问 http://127.0.0.1:8080/console");
    }
    throw new Error(body.error || (resp.status + " " + resp.statusText));
  }
  return body;
}

// ---- 呈现辅助 ----
function msg(el, kind, text) {
  // kind: err | warn | loading | ""（清空）
  el.innerHTML = text
    ? `<div class="banner ${kind}"><span>${kind === "loading" ? '<span class="spin"></span>' : "⚠"}</span><span>${esc(text)}</span>${kind === "err" ? '<span class="x" onclick="this.parentElement.remove()">✕</span>' : ""}</div>`
    : "";
}
function emptyRow(cols, icon, text) {
  return `<tr><td colspan="${cols}"><div class="empty"><span class="ico">${icon}</span>${esc(text)}</div></td></tr>`;
}
function timeAgo(iso) {
  if (!iso) return "—";
  const d = new Date(iso), diff = (Date.now() - d) / 1000;
  const full = iso.replace("T", " ").slice(0, 19);
  if (diff < 60) return `<span title="${esc(full)}">${Math.max(0, Math.floor(diff))}s 前</span>`;
  if (diff < 3600) return `<span title="${esc(full)}">${Math.floor(diff/60)}m 前</span>`;
  if (diff < 86400) return `<span title="${esc(full)}">${Math.floor(diff/3600)}h 前</span>`;
  return `<span title="${esc(full)}">${Math.floor(diff/86400)}d 前</span>`;
}
function setConn(ok) {
  $("connDot").className = "dot " + (ok ? "ok" : "bad");
  $("lastRefresh").textContent = "刷新于 " + new Date().toLocaleTimeString();
}

// ---- 统计卡片 ----
function renderStats(clusters, topoNodes) {
  const act = clusters.filter(c => c.state === "open" || c.state === "acked").length;
  const res = clusters.filter(c => c.state === "resolved").length;
  $("statActive").innerHTML = act + ' <small>簇</small>';
  $("statResolved").innerHTML = res + ' <small>簇</small>';
  $("statNodes").innerHTML = (topoNodes ?? "—") + ' <small>个</small>';
  $("statEdges").innerHTML = window._lastEdges != null
    ? window._lastEdges + ' <small>条</small>' : "—";
}

// ---- 簇列表 ----
let clusterCache = [];
async function loadClusters() {
  msg($("clusterMsg"), "loading", "加载告警簇…");
  try {
    const state = $("clusterState").value;
    const data = await fetchJSON("/api/v1/clusters?state=" + state + "&limit=200");
    clusterCache = data.clusters || [];
    $("clusterCount").textContent = `（${data.count}${data.truncated ? "+，已截断" : ""}）`;
    $("clusterRows").innerHTML = clusterCache.map(c => `
      <tr class="clickable" data-key="${esc(c.cluster_key)}">
        <td class="mono">${esc(c.cluster_key)}</td>
        <td>${statePill(c.state)}</td>
        <td>${sevPill(c.severity)}</td>
        <td class="num">${c.alert_count}</td>
        <td>${esc(c.summary || "-")}</td>
        <td class="num">${(c.fingerprints||[]).length}</td>
        <td class="num">${(c.node_keys||[]).length}</td>
        <td class="time">${timeAgo(c.last_seen_at)}</td>
      </tr>`).join("") || emptyRow(8, "🗂", "当前过滤条件下没有簇——影子降噪在跑，等告警进管道");
    $("clusterRows").querySelectorAll("tr.clickable").forEach(tr => {
      tr.onclick = () => {
        $("clusterRows").querySelectorAll("tr").forEach(r => r.classList.remove("sel"));
        tr.classList.add("sel");
        showClusterDetail(tr.dataset.key);
      };
    });
    msg($("clusterMsg"), "", "");
    setConn(true);
    renderStats(clusterCache, null);
  } catch (e) {
    msg($("clusterMsg"), "err", "加载失败：" + e.message);
    $("clusterRows").innerHTML = "";
    setConn(false);
  }
}

async function showClusterDetail(key) {
  const box = $("clusterDetail");
  box.style.display = "block";
  box.innerHTML = `<div class="dt">簇详情 ${esc(key)}</div><span class="spin"></span>`;
  try {
    const c = await fetchJSON("/api/v1/clusters/" + encodeURIComponent(key));
    const kv = [
      ["状态", c.state], ["严重级", c.severity || "-"], ["告警数", c.alert_count],
      ["首见", (c.first_seen_at||"").replace("T"," ").slice(0,19)],
      ["最近", (c.last_seen_at||"").replace("T"," ").slice(0,19)],
      ["指纹", (c.fingerprints||[]).join(", ") || "-"],
      ["节点", (c.node_keys||[]).join(", ") || "-"],
    ];
    box.innerHTML = `<div class="dt">簇详情</div>` + kv.map(([k,v]) =>
      `<div><span style="color:var(--muted)">${esc(k)}:</span> ${esc(v)}</div>`).join("");
  } catch (e) { box.textContent = "加载失败：" + e.message; }
}

// ---- 拓扑 ----
const AGG_THRESHOLD = 300;
async function loadTopology() {
  msg($("topoMsg"), "loading", "加载拓扑…");
  try {
    const data = await fetchJSON("/api/v1/topology");
    const nodes = data.nodes || [], edges = data.edges || [];
    window._lastEdges = edges.length;
    $("topoMeta").textContent = `（${nodes.length} 节点 / ${edges.length} 边）`;
    const view = $("topoView");
    if (nodes.length === 0) {
      view.innerHTML = `<div class="empty"><span class="ico">🕸</span>拓扑为空——等第一轮发现进图</div>`;
    } else if (nodes.length > AGG_THRESHOLD) {
      renderAggregate(nodes, edges);
    } else {
      renderGraph(nodes, edges);
    }
    msg($("topoMsg"), "", "");
    renderStats(clusterCache, nodes.length);
  } catch (e) {
    msg($("topoMsg"), "err", "加载失败：" + e.message);
  }
}

function renderAggregate(nodes, edges) {
  // P2-1 聚合渲染：按 node_type 分桶，统计置信度分布。
  const byType = {};
  for (const n of nodes) {
    const t = n.node_type || "unknown";
    byType[t] = byType[t] || { count: 0, high: 0, medium: 0, low: 0 };
    byType[t].count++;
    byType[t][n.confidence || "low"] = (byType[t][n.confidence || "low"] || 0) + 1;
  }
  let html = `<div class="banner warn">节点数 ${nodes.length} 超过渲染阈值 ${AGG_THRESHOLD}——聚合视图（按类型分桶，钻取展开留 W6+）</div><div class="tablewrap"><table>
    <thead><tr><th>type</th><th class="num">节点数</th><th class="num">high</th><th class="num">medium</th><th class="num">low</th></tr></thead><tbody>`;
  for (const [t, v] of Object.entries(byType).sort()) {
    html += `<tr><td>${esc(t)}</td><td class="num">${v.count}</td><td class="num">${v.high||0}</td><td class="num">${v.medium||0}</td><td class="num">${v.low||0}</td></tr>`;
  }
  html += `</tbody></table></div>`;
  $("topoView").innerHTML = html;
}

function renderGraph(nodes, edges) {
  const W = 1100, H = 560, R = Math.min(230, 60 + nodes.length * 4);
  const pos = {};
  nodes.forEach((n, i) => {
    const a = (2 * Math.PI * i) / nodes.length - Math.PI / 2;
    pos[n.node_key] = { x: W/2 + R * Math.cos(a), y: H/2 + R * Math.sin(a) };
  });
  const color = { high: "var(--high)", medium: "var(--medium)", low: "var(--low)" };
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px">`;
  for (const e of edges) {
    const s = pos[e.src_key], d = pos[e.dst_key];
    if (!s || !d) continue;
    svg += `<line x1="${s.x}" y1="${s.y}" x2="${d.x}" y2="${d.y}" stroke="var(--border-strong)" stroke-width="1"/>`;
  }
  for (const n of nodes) {
    const p = pos[n.node_key];
    const c = color[n.confidence || "low"] || color.low;
    const r = n.confidence === "high" ? 6 : 4;
    svg += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${c}" data-key="${esc(n.node_key)}" style="cursor:pointer"><title>${esc(n.node_key)} (${esc(n.node_type)}, ${esc(n.confidence)})</title></circle>`;
  }
  nodes.slice(0, 40).forEach((n) => {
    const p = pos[n.node_key];
    svg += `<text x="${p.x + 9}" y="${p.y + 3}">${esc(n.node_key.length > 28 ? n.node_key.slice(0, 27) + "…" : n.node_key)}</text>`;
  });
  svg += `</svg>`;
  $("topoView").innerHTML = svg;
  $("topoView").querySelectorAll("circle").forEach(c => {
    c.onclick = () => showNodeDetail(c.dataset.key);
  });
}

async function showNodeDetail(key) {
  const box = $("nodeDetail");
  box.style.display = "block";
  box.innerHTML = `<div class="dt">节点 ${esc(key)}</div><span class="spin"></span>`;
  try {
    const [topo, changes] = await Promise.all([
      fetchJSON("/api/v1/topology?node_key=" + encodeURIComponent(key) + "&depth=1"),
      fetchJSON("/api/v1/changes?node_key=" + encodeURIComponent(key) +
        "&window_start=" + new Date(Date.now() - 24*3600*1000).toISOString()),
    ]);
    const ch = changes.changes || [];
    box.innerHTML = `<div class="dt">节点 ${esc(key)}</div>` +
      `<div>邻居 <b>${(topo.nodes||[]).length - 1}</b> · 边 <b>${(topo.edges||[]).length}</b> · 24h 变更 <b>${ch.length}</b></div>` +
      (ch.length
        ? ch.map(c => `<div><span style="color:var(--muted)">[${esc(c.change_type)}]</span> ${esc((c.occurred_at||"").replace("T"," ").slice(0,19))} ${esc(c.actor || c.source || "")} ${esc(c.summary || "")}</div>`).join("")
        : `<div style="color:var(--muted)">24h 内无变更</div>`);
  } catch (e) { box.textContent = "加载失败：" + e.message; }
}

function refreshAll() {
  const b = $("btnRefresh");
  b.classList.add("busy"); b.disabled = true;
  Promise.allSettled([loadClusters(), loadTopology()]).then(() => {
    b.classList.remove("busy"); b.disabled = false;
  });
}

let timer = null;
$("autoRefresh").onchange = () => {
  if (timer) { clearInterval(timer); timer = null; }
  if ($("autoRefresh").checked) timer = setInterval(refreshAll, 30000);
};
$("clusterState").onchange = loadClusters;
if ($("autoRefresh").checked) timer = setInterval(refreshAll, 30000);
refreshAll();
</script>
</body>
</html>
